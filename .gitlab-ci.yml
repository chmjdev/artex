workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

stages: [frontend, build, smoke]

variables:
  # Go's module cache contains read-only files. Retain only this project's
  # cache between native-runner jobs; clean all other untracked outputs.
  GIT_CLEAN_FLAGS: "-ffdx -e .cache/"

default:
  tags: [kvm]
  before_script:
    - test "$CI_RUNNER_ID" = "3"
    - test "$(uname -s)" = "Linux"
    - test "$(uname -m)" = "x86_64"

build:frontend:
  rules:
    - if: '$ARTEX_ESTATE_AUDIT == "1"'
      when: never
    - when: on_success
  stage: frontend
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  script:
    - node --version
    - cd web
    - npm ci --ignore-scripts
    - npm run build:static
    - cd ..
    - mkdir -p server/webui/dist
    - cp -a web/out/. server/webui/dist/
  artifacts:
    paths: [server/webui/dist/]
    expire_in: 14 days

build:linux:
  rules:
    - if: '$ARTEX_ESTATE_AUDIT == "1"'
      when: never
    - when: on_success
  stage: build
  needs: [build:frontend]
  variables:
    GOTOOLCHAIN: go1.26.11
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/gomod"
    ARTEX_SKIP_FRONTEND: "1"
    ARTEX_SKIP_NPM_CI: "1"
    ARTEX_COMPRESS: "0"
    ARTEX_PACKAGE: "0"
    ARTEX_OUTPUT_DIR: dist
    ARTEX_PACKAGE_DIR: dist
  script:
    - go version
    - export ARTEX_BUILD_VERSION="binteca-${CI_COMMIT_SHORT_SHA}"
    - bash ./build.sh --target linux/amd64
    - cp -a skills dist/artex-linux-amd64/
    - cp start.sh config.example.json LICENSE README.md dist/artex-linux-amd64/
    - tar -czf "dist/artex-${ARTEX_BUILD_VERSION}-linux-amd64.tar.gz" -C dist artex-linux-amd64
    - sha256sum dist/*.tar.gz > dist/SHA256SUMS
    - sha256sum dist/artex-linux-amd64/artex > dist/BINARY-SHA256SUMS
    - printf 'source=%s\npipeline=%s\njob=%s\nrunner=%s\nplatform=linux/amd64\n' "$CI_COMMIT_SHA" "$CI_PIPELINE_URL" "$CI_JOB_URL" "$CI_RUNNER_ID" > dist/build-receipt.txt
  artifacts:
    paths: [dist/]
    expire_in: 30 days

smoke:zeus:
  rules:
    - if: '$ARTEX_ESTATE_AUDIT == "1"'
      when: never
    - when: on_success
  stage: smoke
  needs: [build:linux]
  environment:
    name: artex-smoke
  script:
    - python3 ci/zeus-smoke.py
  artifacts:
    when: always
    paths: [dist/model-smoke.json]
    expire_in: 30 days

estate:read-only:
  stage: smoke
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $ARTEX_ESTATE_AUDIT == "1"'
  environment:
    name: artex-smoke
    action: verify
  variables:
    GOTOOLCHAIN: go1.26.11
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/gomod"
  script:
    - mkdir -p dist
    - go build -ldflags "-X main.version=$CI_COMMIT_SHA" -o dist/artex ./cmd/artex
    - sha256sum dist/artex > dist/audit-binary.sha256
    - printf '%s' "$ARTEX_ESTATE_INPUT" | dist/artex estate-audit > dist/estate-audit.json
  artifacts:
    when: always
    paths: [dist/estate-audit.json, dist/audit-binary.sha256]
    expire_in: 7 days
